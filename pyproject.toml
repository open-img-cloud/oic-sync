[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "oic-sync"
dynamic = ["version"]
description = "Keep openimages.cloud signed cloud images in sync with OpenStack Glance or Proxmox VE"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Open Image Cloud" }]
keywords = [
  "openstack", "glance", "proxmox", "pve", "cloud-images", "cosign", "sigstore", "qcow2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "httpx>=0.27,<1",
  "sigstore>=4,<5",
]

[project.optional-dependencies]
# The OpenStack backend; the Proxmox VE backend only needs pvesh on the node.
openstack = ["openstacksdk>=3.0"]
test = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://openimages.cloud"
Source = "https://github.com/open-img-cloud/oic-sync"
Issues = "https://github.com/open-img-cloud/oic-sync/issues"

[project.scripts]
oic-sync = "oic_sync.cli:main"

[tool.hatch.version]
path = "src/oic_sync/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/oic_sync"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: needs the network (CDN and Sigstore); run with OIC_LIVE_TESTS=1"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT", "RET", "C4"]
ignore = [
  "S101",  # assert is fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["oic_sync", "fakes"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
